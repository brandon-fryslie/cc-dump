[project]
name = "cc-dump"
version = "0.3.0"
description = "Transparent HTTP proxy for monitoring Claude Code API traffic with TUI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Brandon Fryslie", email = "brandon@fryslie.com"}]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "textual-serve>=1.0.0",
    "libtmux>=0.30.0",
    "watchfiles>=1.0.0",
    "snarfx>=0.1.0",
    "truststore>=0.10.4",
    "cryptography>=42.0.0",
    "pydantic>=2.8.2",
]
keywords = ["claude", "anthropic", "proxy", "api", "debugging", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/brandon-fryslie/cc-dump"
Repository = "https://github.com/brandon-fryslie/cc-dump"
Issues = "https://github.com/brandon-fryslie/cc-dump/issues"

[project.scripts]
cc-dump = "cc_dump.cli:main"
cc-dump-serve = "cc_dump.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_dump"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "ptydriver>=0.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "requests>=2.31.0",
    # Quality-gate tools are pinned exactly, not floored: the gate is a merge-blocking
    # required check, so its verdict must be identical across machines and CI runs.
    # An unpinned linter is a clock with no hands — a newer ruff silently expanded its
    # default ruleset from ~122 to ~830 rules and turned the gate red on unchanged src.
    "ruff==0.16.0",
    "radon==6.0.1",
]

[tool.ruff]
# target-version is stated explicitly (not left to requires-python inference) so the
# pyupgrade (UP*) rules resolve to one deterministic Python target across machines.
target-version = "py310"

[tool.ruff.lint]
# BLE001 (blind-except) is deliberately disabled — a documented architectural decision,
# not debt being papered over. This codebase is a live monitoring proxy + TUI whose core
# product value is "never crash the thing you're monitoring." It therefore isolates
# failures at boundaries and REPORTS them ([LAW:effects-at-boundaries],
# [LAW:single-enforcer]): sink dispatch, tmux/libtmux calls, hot-reload of arbitrary
# reloaded code, per-connection proxy handlers, and replay/event processing all wrap
# work in `except Exception` that logs (or recovers) and continues. All 44 flagged sites
# are that pattern — every one logs or transitions state; none swallow silently.
# Catching `Exception` is the *correct contract* at these boundaries: the whole point is
# to contain ANY failure, including exception types a narrowed tuple could not anticipate.
# Narrowing them would let an unguessed exception crash the live proxy mid-session — a
# strictly worse outcome than a logged warning. Genuinely-silent swallows are a different
# smell (`except: pass`) and are caught by S110, which stays enabled and is fully fixed.
# See docs/LINT_DECISIONS.md for the full reasoning. Do not re-enable without revisiting
# the boundary-isolation design.
ignore = ["BLE001"]

[tool.ruff.lint.isort]
# Combine multiple `from X import ...` (including aliased imports) into one statement.
# Without this, isort's default splits each aliased import onto its own `from X import
# (y as z)` line — fragmenting a single clean import into many. [LAW:decomposition]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# HarRecorder owns a single streaming file handle for its whole lifetime (opened in
# lazy-init, written across many events, closed in close()). SIM115 ("use a context
# manager") does not fit a long-lived resource holder; scoping the ignore to this one
# file keeps SIM115 enforced everywhere else. See docs/LINT_DECISIONS.md.
"src/cc_dump/pipeline/har_recorder.py" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pty: tests requiring PTY subprocess (slow)",
    "textual: in-process Textual harness tests (fast)",
]
filterwarnings = [
    "ignore:.*use of forkpty\\(\\).*:DeprecationWarning",
]

[tool.mypy]
# Run: uv run mypy src
mypy_path = "stubs"
check_untyped_defs = true
disallow_any_explicit = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = [
    "dict-item",      # 27 errors — rendering dispatch table signature mismatches
    "arg-type",       # 26 errors — list variance, tuple element types
    "union-attr",     # 23 errors — accessing attrs on Optional without narrowing
    "attr-defined",   # 18 errors — dynamic attrs (_expandable, _xml_strip_ranges, etc.)
]
